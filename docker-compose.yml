# Moodle 4.5 LTS yerel geliştirme ortamı (OptikSınav eklenti geliştirme)
# Eklenti kaynak kodu ./plugins altından konteynerin mod/ ve local/ dizinlerine bind-mount edilir;
# böylece host'ta düzenle → konteynerde anında görünür.
services:
  mariadb:
    # Not: Bitnami, Ağu 2025'te ücretsiz Docker Hub kataloğunu "bitnamilegacy"e taşıdı.
    # Dev için sabitlenmiş legacy etiketleri kullanıyoruz.
    image: docker.io/bitnamilegacy/mariadb:11.4.7
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - MARIADB_USER=bn_moodle
      - MARIADB_PASSWORD=bn_moodle_pass
      - MARIADB_DATABASE=bitnami_moodle
      - MARIADB_ROOT_PASSWORD=root_pass
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/bitnami/mariadb
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/mariadb/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 10

  moodle:
    image: docker.io/bitnamilegacy/moodle:4.5
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      # Host 8081/8444 — 8080 başka bir projece kullanılıyor olabilir.
      - "8081:8080"
      - "8444:8443"
    environment:
      - MOODLE_DATABASE_HOST=mariadb
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_PASSWORD=bn_moodle_pass
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=Admin12345!
      - MOODLE_EMAIL=admin@example.com
      - MOODLE_SITE_NAME=OptikSinav Dev
      # Geliştirme: hata ayıklamayı aç
      - BITNAMI_DEBUG=true
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
      # NOT (Bitnami tuzağı): Eklenti bind-mount'u ANCAK temiz ilk kurulum bittikten sonra
      # etkinleştirilmeli. Aksi halde /bitnami/moodle ilk açılışta "boş değil" görünür ve
      # Bitnami kurulum yerine geri-yükleme moduna girip takılır.
      # 1. aşama (temiz kurulum): aşağıdaki satırlar YORUMDA kalır.
      # 2. aşama (eklenti geliştirme): yorumu kaldır + `docker compose up -d` ile moodle'ı yeniden oluştur.
      - ./plugins/mod/optiksinav:/bitnami/moodle/mod/optiksinav
      # - ./plugins/local/optiksinav:/bitnami/moodle/local/optiksinav   # Faz 4

volumes:
  mariadb_data:
  moodle_data:
  moodledata_data:
